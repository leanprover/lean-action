name: 'lake check test'
description: 'Verify `lake-check: paranoid` succeeds on a clean package and fails once a sorry is introduced.'
inputs:
  toolchain:
    description: 'Toolchain to use for the test'
    required: true
  sandbox:
    description: 'Value for the `lake-check-sandbox` input. GitHub-hosted runners need one; a privileged Namespace container needs none.'
    required: false
    default: 'none'
runs:
  using: 'composite'
  steps:
    # TODO: once `lean-action` supports just setup, use it here
    - name: install elan
      run: |
        set -o pipefail
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain ${{ inputs.toolchain }}
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: create a clean lake library
      run: |
        lake init foo lib
        lake update
      shell: bash

    - name: "run `lean-action` (clean package)"
      id: lean-action-clean
      uses: ./
      with:
        use-github-cache: false
        lake-check: paranoid
        lake-check-sandbox: ${{ inputs.sandbox }}

    - name: verify lake check success on the clean package
      env:
        OUTPUT_NAME: "lake-check-status"
        EXPECTED_VALUE: "SUCCESS"
        ACTUAL_VALUE: ${{ steps.lean-action-clean.outputs.lake-check-status }}
      run: .github/functional_tests/test_helpers/verify_action_output.sh
      shell: bash

    # `lake check` permits only the standard axioms, so a `sorry` is enough to make every kernel
    # it runs reject the project.
    - name: introduce a sorry
      run: |
        printf '\ntheorem fooSorry : True := by sorry\n' >> Foo/Basic.lean
      shell: bash

    - name: "rerun `lean-action` (sorry introduced)"
      id: lean-action-dirty
      uses: ./
      continue-on-error: true # required so that the failing check does not fail the workflow
      with:
        use-github-cache: false
        lake-check: paranoid
        lake-check-sandbox: ${{ inputs.sandbox }}

    - name: verify lake check failure once a sorry is introduced
      env:
        OUTPUT_NAME: "lake-check-status"
        EXPECTED_VALUE: "FAILURE"
        ACTUAL_VALUE: ${{ steps.lean-action-dirty.outputs.lake-check-status }}
      run: .github/functional_tests/test_helpers/verify_action_output.sh
      shell: bash
