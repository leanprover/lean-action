name: 'lake check unsupported toolchain test'
description: 'Verify `lake-check` fails loudly, rather than silently passing, on a toolchain without `lake check`.'
inputs:
  toolchain:
    description: 'Toolchain to use for the test. Must be older than v4.35.0-rc1.'
    required: true
runs:
  using: 'composite'
  steps:
    # TODO: once `lean-action` supports just setup, use it here
    - name: install elan
      run: |
        set -o pipefail
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain ${{ inputs.toolchain }}
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: create a clean lake library
      run: |
        lake init foo lib
        lake update
      shell: bash

    - name: "run `lean-action` on a toolchain without `lake check`"
      id: lean-action-unsupported
      uses: ./
      continue-on-error: true # required so that the expected failure does not fail the workflow
      with:
        use-github-cache: false
        lake-check: "true"

    # A check that cannot run has to be reported as a failure. Silently passing would tell a
    # project its kernel was independently replayed when nothing ran at all.
    - name: verify lake check fails on an unsupported toolchain
      env:
        OUTPUT_NAME: "lake-check-status"
        EXPECTED_VALUE: "FAILURE"
        ACTUAL_VALUE: ${{ steps.lean-action-unsupported.outputs.lake-check-status }}
      run: .github/functional_tests/test_helpers/verify_action_output.sh
      shell: bash

    - name: verify the action step itself failed
      env:
        STEP_OUTCOME: ${{ steps.lean-action-unsupported.outcome }}
      run: |
        if [ "$STEP_OUTCOME" != "failure" ]; then
          echo "::error::expected the lean-action step to fail, but its outcome was '$STEP_OUTCOME'"
          exit 1
        fi
        echo "lean-action failed as expected"
      shell: bash
